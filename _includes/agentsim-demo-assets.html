{% comment %} Styles and play-on-scroll script for agentsim-grid.html. Include once per page. {% endcomment %}
<style>
  .agentsim-case { margin: 1em 0 1.5em; }
  .agentsim-grid { display: block; width: 100%; height: auto; background: #000; border-radius: 4px; }
  .agentsim-case__meta { margin: 0.6em 0 0.3em; font-size: 0.8em; color: var(--global-text-color-light); }
  .agentsim-legend { list-style: none; margin: 0; padding: 0; font-size: 0.85em; columns: 2; column-gap: 2em; }
  .agentsim-legend li { break-inside: avoid; margin: 0 0 0.35em; padding-left: 3.4em; text-indent: -3.4em; }
  .agentsim-tag { display: inline-block; min-width: 2.9em; margin-right: 0.3em; padding: 0 0.4em; border-radius: 3px;
                  background: var(--global-border-color); color: var(--global-text-color); font-weight: bold; font-size: 0.85em; text-indent: 0; text-align: center; }
  .agentsim-tag--base { background: var(--global-link-color); color: #fff; }
  .agentsim-clip-link { font-size: 0.85em; margin-left: 0.3em; }
  .agentsim-note { font-size: 0.85em; color: var(--global-text-color-light); }
  .agentsim-attribution { margin-top: 2.5em; }
  .agentsim-strip { margin: 0.5em 0 1em; font-size: 0.85em; }
  .agentsim-strip summary { cursor: pointer; }
  .agentsim-strip img { display: block; width: 100%; height: auto; margin-top: 0.75em; border: 1px solid var(--global-border-color); }
  @media (max-width: 600px) {
    .agentsim-legend { columns: 1; }
  }
</style>
<script>
  // Play each grid while it is on screen, pause it when it leaves. Autoplay is only
  // allowed because the videos are muted; without JavaScript the controls still work.
  (function () {
    var videos = document.querySelectorAll('video.agentsim-grid');
    if (!('IntersectionObserver' in window) || videos.length === 0) { return; }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var video = entry.target;
        if (entry.isIntersecting) {
          var p = video.play();
          if (p && typeof p.catch === 'function') { p.catch(function () {}); }
        } else if (!video.paused) {
          video.pause();
        }
      });
    }, { threshold: 0.4 });
    videos.forEach(function (video) { observer.observe(video); });
  })();
</script>
