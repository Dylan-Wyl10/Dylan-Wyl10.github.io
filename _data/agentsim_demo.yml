# AgentSim website demo: three Waymo Open Motion Dataset drives, each replayed (base)
# and mutated by AgentSim, rendered as 12 s front-camera clips by a video world model.
# Source package: ~/Research/AgentSim/renders/AgentSim/website_demo/manifest.json (AgentSim repo PR #25,
# refreshed 2026-10-17 so every drive has base + 5 variants; third drive swapped for a freeway scene on
# 2026-10-19, YIL-216).
# Each group has one synchronized grid video (grid.mp4, built by scripts/agentsim_demo_grids.py from the
# clips with the short `label` burned into each cell) plus the individual clips. The page at
# _pages/agentsim-demo.md and the include _includes/agentsim-grid.html loop over this file; edit text here.
title: 'AgentSim: closed-loop scenario mutations of real drives, rendered by a video world model'
asset_root: /assets/demo/agentsim
groups:
- key: womd_d1988864
  title: 'Signalized intersection: the ego pulls away from a queue'
  dataset: Waymo Open Motion Dataset v1 validation
  scenario_id: d1988864008fc062
  contact_sheet: contact_sheet.jpg
  grid_video: grid.mp4
  grid_poster: grid.jpg
  grid_width: 1920
  grid_height: 704
  clips:
  - index: base
    label: Base · logged drive
    description: 'The logged drive: the ego pulls away from a queue and crosses a signalized intersection.'
    video: clips/base.mp4
    poster: clips/base.jpg
    duration_s: 11.9
  - index: var1
    label: Var 1 · lead car brakes hard at 3 s
